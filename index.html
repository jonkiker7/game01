<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c0a24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Star Rotor" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet" />
    <title>Star Rotor</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>

    <div id="hud">
      <div id="stick-zone">
        <div id="stick-base"><div id="stick-knob"></div></div>
      </div>

      <div id="buttons">
        <div id="btn-gun" class="btn btn-big" role="button" aria-label="Machine gun">GUN</div>
        <div id="btn-missile" class="btn" role="button" aria-label="Missile">MSL</div>
        <div id="btn-boost" class="btn" role="button" aria-label="Boost">BOOST</div>
      </div>

      <div id="fps"></div>
    </div>

    <div id="rotate">
      <div>
        <div class="rotate-icon">⟳</div>
        Turn your phone sideways to play
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
